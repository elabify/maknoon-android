# Maknoon Android CI. Two jobs:
#   leak-scan  - fast guard on every push/PR: fails if anything that must stay
#                private slipped into a manual edit.
#   release    - on a vX.Y.Z tag only, behind the `play-internal` Environment
#                (required-reviewer gate): builds the signed AAB and uploads it
#                to the Play *internal* track. Promote internal -> production
#                manually in the Play Console.
#
# Play auth is KEYLESS (the org blocks downloadable SA keys): GitHub OIDC ->
# Workload Identity Federation impersonates the publisher service account. The
# one-time WIF + secrets + Environment setup lives in the maintainer release
# runbook.
name: ci-android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  leak-scan:
    name: leak scan
    # Branch pushes + PRs only. On a TAG nothing should auto-run before the
    # approval gate, so the scan moves INTO the gated release job below; that
    # way a tag surfaces only the single gated job (matches the iOS workflow).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan for forbidden content
        run: |
          set -uo pipefail
          # Patterns use char-classes (e.g. [/]) so this file does not itself
          # contain the literal forbidden strings it scans for.
          patterns=(
            'elabify[/]musnad'
            'BEGIN [A-Z ]*PRIVATE[ ]KEY'
            'OPENSSH[ ]PRIVATE[ ]KEY'
            'ghp_[0-9A-Za-z]{30,}'
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-[0-9A-Za-z-]{8,}'
            'CARGO_REGISTRY[_]TOKEN'
            'docs/(decisions|operations|integrations|reference)/'
            '(\.\.[/]|code[/])(issuer-backend|verifier-server|vault-plugin|smart-contracts|demo-web-app|ios-sdk-musnad)'
          )
          fail=0
          for p in "${patterns[@]}"; do
            hits="$(grep -rEnI --exclude-dir=.git "$p" . 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "::error::forbidden pattern matched: /$p/"
              echo "$hits" | head -20
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "leak scan clean" || exit 1

  release:
    name: release to Play internal
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required-reviewer gate: the upload pauses here until you approve the
    # `play-internal` Environment in the run's UI.
    environment: play-internal
    permissions:
      contents: write          # create the GitHub Release + attach the sideload APK
      id-token: write          # mint the OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Leak scan runs here (after the gate) on tags, since the standalone
      # leak-scan job is skipped for tags so nothing auto-runs pre-approval.
      - name: Scan for forbidden content
        run: |
          set -uo pipefail
          patterns=(
            'elabify[/]musnad'
            'BEGIN [A-Z ]*PRIVATE[ ]KEY'
            'OPENSSH[ ]PRIVATE[ ]KEY'
            'ghp_[0-9A-Za-z]{30,}'
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-[0-9A-Za-z-]{8,}'
            'CARGO_REGISTRY[_]TOKEN'
            'docs/(decisions|operations|integrations|reference)/'
            '(\.\.[/]|code[/])(issuer-backend|verifier-server|vault-plugin|smart-contracts|demo-web-app|ios-sdk-musnad)'
          )
          fail=0
          for p in "${patterns[@]}"; do
            hits="$(grep -rEnI --exclude-dir=.git "$p" . 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "::error::forbidden pattern matched: /$p/"
              echo "$hits" | head -20
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "leak scan clean" || exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK (matches build.gradle ndkVersion)
        run: sdkmanager --install "ndk;30.0.14904198"

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pq-crypto-rs
            ledger-btc-rs
            ledger-eth-rs
            ledger-sol-rs
            ledger-tron-rs
            trezor-core-rs

      - name: Build core AARs (pq-crypto + 5 hardware-wallet cores)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.14904198"
          # Align NDK_ROOT with NDK_HOME so cargo-ndk does not warn about the
          # runner's default ANDROID_NDK_ROOT pointing at a different NDK version.
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # 1. pq-crypto AAR (consumed in place from build/outputs/aar).
          echo "::group::build-aar (pq-crypto-rs)"
          bash pq-crypto-rs/android/build-aar.sh
          echo "::endgroup::"
          # 2. The five hardware-wallet core AARs -> android-sdk-musnad/hwlibs
          #    under the exact names the SDK's flatDir deps resolve
          #    (musnad-sdk/build.gradle.kts): the four ledger cores carry a
          #    "-core" suffix (:ledger-btc-core@aar ...), trezor-core does not.
          #    Crate dir "ledger-btc-rs" -> artifact "ledger-btc-core.aar".
          mkdir -p android-sdk-musnad/hwlibs
          for c in ledger-btc-rs ledger-eth-rs ledger-sol-rs ledger-tron-rs trezor-core-rs; do
            echo "::group::build-aar ($c)"
            bash "$c/android/build-aar.sh"
            case "$c" in
              trezor-core-rs) dest="trezor-core" ;;
              *)              dest="${c%-rs}-core" ;;   # ledger-btc-rs -> ledger-btc-core
            esac
            cp "$c/android/library/build/outputs/aar/library-release.aar" \
               "android-sdk-musnad/hwlibs/${dest}.aar"
            echo "::endgroup::"
          done

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # build.gradle.kts reads keystore.properties at the Gradle root.
          cat > android-app-elabify/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Authenticate to Google Play (Workload Identity Federation, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PUBLISHER_SA }}
        # Writes a keyless external_account ADC file and exports
        # GOOGLE_APPLICATION_CREDENTIALS, which the play{} block consumes.

      - name: Trust the GitHub OIDC token endpoint CA in the JDK truststore
        # gradle-play-publisher does the Workload Identity *subject-token* fetch
        # in-JVM, GET-ing $ACTIONS_ID_TOKEN_REQUEST_URL (GitHub's OIDC endpoint on
        # *.actions.githubusercontent.com). That endpoint's TLS cert chains to a CA
        # (Microsoft RSA Root CA 2017) that is NOT in the Temurin cacerts shipped by
        # setup-java, so the fetch dies with:
        #   IdentityPoolCredentials.getSubjectTokenFromMetadataServer
        #   -> SSLHandshakeException: PKIX path building failed.
        # The Node `auth` step above succeeds because it uses the OS trust store, not
        # the JVM. Import the endpoint's live chain (leaf + intermediates) into the
        # active JDK truststore so the in-JVM fetch validates. Re-fetched each run, so
        # it tracks cert rotation. Keeps the keyless WIF design intact (no SA key).
        run: |
          set -euo pipefail
          host="$(printf '%s' "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" | sed -E 's#^https?://([^/:]+).*#\1#')"
          if [ -z "$host" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty (need permissions: id-token: write)"
            exit 1
          fi
          echo "Importing TLS chain for $host into $JAVA_HOME/lib/security/cacerts"
          tmp="$(mktemp -d)"
          openssl s_client -showcerts -servername "$host" -connect "$host:443" </dev/null 2>/dev/null \
            | awk -v d="$tmp" '/BEGIN CERTIFICATE/{n++} n{print > (d"/c"n".pem")}'
          shopt -s nullglob
          count=0
          for f in "$tmp"/c*.pem; do
            [ -s "$f" ] || continue
            count=$((count+1))
            # cacerts is root-owned, so import as root (passwordless sudo on
            # GitHub runners). Full keytool path because sudo resets PATH;
            # $JAVA_HOME is expanded by this shell before sudo runs. The gradle
            # JVM (and GPP's forked worker) read this same JAVA_HOME cacerts.
            sudo "$JAVA_HOME/bin/keytool" -importcert -noprompt -trustcacerts \
              -alias "gh-oidc-$count" -file "$f" \
              -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no certificates captured from $host"
            exit 1
          fi
          echo "imported $count certificate(s) for $host"

      - name: Build signed AAB + upload to Play internal
        working-directory: android-app-elabify
        # versionCode is auto-derived from the monotonic run number (build.gradle.kts
        # reads ANDROID_VERSION_CODE) so a Play upload is never rejected for a duplicate
        # code; versionName stays at the release. Survives the shallow checkout (unlike
        # git rev-list --count).
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        # The previous step imported the GitHub OIDC CA into $JAVA_HOME's cacerts, but
        # gradle-play-publisher does the Workload-Identity token fetch in a FORKED
        # gradle worker JVM that didn't pick up that truststore (rc5 still PKIX-failed).
        # JAVA_TOOL_OPTIONS is inherited by every child JVM (incl. forked workers), so
        # force the trust store onto the cacerts we just imported into. Set it in the
        # shell so $JAVA_HOME expands (env: block values are not shell-expanded).
        run: |
          export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=$JAVA_HOME/lib/security/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          ./gradlew :app:publishReleaseBundle --no-daemon --stacktrace

      - name: Build signed APK + attach to a GitHub Release (sideload / GrapheneOS / Obtainium)
        # The Play AAB is re-signed by Play App Signing; this APK is signed with our
        # upload key (release.jks) and is the GMS-free sideload channel for GrapheneOS
        # users and Obtainium. arm64-v8a + 16 KB-aligned (build.gradle), so it installs
        # and updates in place on Pixels as long as every GitHub APK uses this key.
        # NOTE: a GitHub/sideload install and a Play install have different signatures,
        # so a user stays on one channel. RC tags publish as a GitHub *pre-release*
        # (Obtainium's default "latest" tracks finals only).
        working-directory: android-app-elabify
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          out="$RUNNER_TEMP/maknoon-${{ github.ref_name }}.apk"
          cp "$apk" "$out"
          pre=""
          case "${{ github.ref_name }}" in *-rc*) pre="--prerelease" ;; esac
          if ! gh release create "${{ github.ref_name }}" "$out" \
                --repo "${{ github.repository }}" --title "${{ github.ref_name }}" \
                --notes "GMS-free signed APK for sideload / Obtainium / GrapheneOS (arm64-v8a, 16 KB-aligned). Distinct signature from the Play build; pick one channel." \
                $pre 2>/dev/null; then
            gh release upload "${{ github.ref_name }}" "$out" --clobber --repo "${{ github.repository }}"
          fi
