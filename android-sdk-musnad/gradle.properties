org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room 2.6.x codegen runs on the KSP1 engine; KSP2 trips "unexpected jvm
# signature V". Pin KSP1 until we move to Room 2.7+ (native KSP2).
ksp.useKSP2=false

# yubikit 3.1.0 requires compileSdk 36; AGP 8.7.3 is tested only to 35, so silence the guard.
android.suppressUnsupportedCompileSdk=36
